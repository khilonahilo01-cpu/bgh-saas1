const isExpired=ag=>{if(!ag?.plan_expires_at)return false;return new Date(ag.plan_expires_at)<new Date();};

};

// ─── DB ───────────────────────────────────────────────────
const DB={
  async register(name,email,password){
    const{data,error}=await sb.from('agencies').insert({name,email,password_hash:hash(password)}).select().single();
    if(error)throw error;
    await sb.from('app_data').insert({agency_id:data.id,data:EMPTY});
    return data;
  },
  async loginAgency(email,password){
    const{data,error}=await sb.from('agencies').select('*').eq('email',email).single();
    if(error||!data)throw new Error('البريد الإلكتروني غير موجود');
    if(data.password_hash!==hash(password))throw new Error('كلمة السر غالطة');
    return data;
  },
  async loginEditor(agencyEmail,editorPassword){
    // Find agency by email
    const{data:ag,error:agErr}=await sb.from('agencies').select('*').eq('email',agencyEmail.toLowerCase().trim()).single();
    if(agErr||!ag)throw new Error('الوكالة غير موجودة');
    // Load agency data to find editor
    const{data:appData}=await sb.from('app_data').select('data').eq('agency_id',ag.id).single();
    const d=appData?.data||EMPTY;
    const editor=d.editors.find(e=>e.password===hash(editorPassword));
    if(!editor)throw new Error('كلمة السر غالطة');
    return{agency:ag,editor,appData:d};
  },
  async loadData(agencyId){
    const{data}=await sb.from('app_data').select('data').eq('agency_id',agencyId).single();
    return data?.data||{...EMPTY};
  },
  async saveData(agencyId,data){
    const{error}=await sb.from('app_data').upsert({agency_id:agencyId,data,updated_at:new Date().toISOString()},{onConflict:'agency_id'});
    if(error)throw error;
  },
  async getAllAgencies(){
    const{data}=await sb.from('agencies').select('*').order('created_at',{ascending:false});
    return data||[];
  },
  async getAgencyData(agencyId){
    const{data}=await sb.from('app_data').select('data').eq('agency_id',agencyId).single();
    return data?.data||{...EMPTY};
  },
  async updateAgency(id,patch){
    await sb.from('agencies').update(patch).eq('id',id);
  },
  async deleteAgency(id){
    await sb.from('app_data').delete().eq('agency_id',id);
    await sb.from('agencies').delete().eq('id',id);
  }
};

// ─── REGISTER ─────────────────────────────────────────────
function Register({onBack,onSuccess}){
  const[name,setName]=useState('');const[email,setEmail]=useState('');
  const[pw,setPw]=useState('');const[show,setShow]=useState(false);
  const[err,setErr]=useState('');const[loading,setLoading]=useState(false);
  const submit=async()=>{
    if(!name.trim())return setErr('دخل اسم الوكالة');
    if(!email.includes('@'))return setErr('البريد الإلكتروني غير صحيح');
    if(pw.length<4)return setErr('كلمة السر لازم تكون 4 حروف على الأقل');
    setLoading(true);setErr('');
    try{const ag=await DB.register(name.trim(),email.toLowerCase().trim(),pw);onSuccess(ag);}
    catch(e){setErr(e.message.includes('duplicate')||e.message.includes('unique')?'هذا البريد الإلكتروني مسجل بالفعل':e.message);}
    finally{setLoading(false);}
  };
  return(
    <AuthCard title="إنشاء حساب وكالة" sub="مجاني تماماً — لا حاجة لبطاقة بنكية">
      <div style={{display:'flex',flexDirection:'column',gap:'1rem'}}>
        <Field label="اسم الوكالة">
          <div style={{position:'relative'}}>
            <div style={{position:'absolute',right:'0.75rem',top:'50%',transform:'translateY(-50%)',display:'flex',pointerEvents:'none'}}><Ic n="building" size={14} color={B.muted}/></div>
            <input value={name} onChange={e=>setName(e.target.value)} placeholder="BGH Marketing" style={{...INP,paddingRight:'2.5rem'}}/>
          </div>
        </Field>
        <Field label="البريد الإلكتروني (للوكالة)">
          <div style={{position:'relative'}}>
            <div style={{position:'absolute',right:'0.75rem',top:'50%',transform:'translateY(-50%)',display:'flex',pointerEvents:'none'}}><Ic n="mail" size={14} color={B.muted}/></div>
            <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="agency@email.com" style={{...INP,paddingRight:'2.5rem'}}/>
          </div>
        </Field>
        <Field label="كلمة السر">
          <PwField value={pw} onChange={setPw} show={show} setShow={setShow} placeholder="4 حروف على الأقل" onEnter={submit}/>
        </Field>

// ─── LOGIN ────────────────────────────────────────────────
function Login({onBack,onAgencyLogin,onEditorLogin,onSuperAdmin}){
  const[role,setRole]=useState('agency'); // agency | editor
  const[email,setEmail]=useState('');
  const[agEmail,setAgEmail]=useState('');
  const[pw,setPw]=useState('');
  const[show,setShow]=useState(false);
  const[err,setErr]=useState('');
  const[loading,setLoading]=useState(false);

  const submit=async()=>{
    if(!pw)return setErr('دخل كلمة السر');
    setLoading(true);setErr('');

    if(email===SUPER_EMAIL&&pw===SUPER_PASS){setLoading(false);onSuperAdmin();return;}

    try{
      if(role==='agency'){
        if(!email.includes('@'))return setErr('دخل البريد الإلكتروني');
        const ag=await DB.loginAgency(email.toLowerCase().trim(),pw);
        onAgencyLogin(ag);
      } else {
        if(!agEmail.includes('@'))return setErr('دخل إيميل الوكالة');
        const{agency,editor,appData}=await DB.loginEditor(agEmail,pw);
        onEditorLogin(agency,editor,appData);
      }
    }catch(e){setErr(e.message);}
    finally{setLoading(false);}
  };

  return(
    <AuthCard title="تسجيل الدخول">
      {/* Role tabs */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'0.375rem',padding:'0.25rem',background:'#111',borderRadius:'0.75rem',marginBottom:'1.25rem'}}>
        {[{v:'agency',l:'وكالة',ic:'building'},{v:'editor',l:'إيديتور',ic:'video'}].map(r=>(
          <button key={r.v} onClick={()=>{setRole(r.v);setErr('');setPw('');}}
            style={{padding:'0.625rem',borderRadius:'0.5rem',fontWeight:'700',fontSize:'0.875rem',display:'flex',alignItems:'center',justifyContent:'center',gap:'0.5rem',border:'none',cursor:'pointer',background:role===r.v?B.accent:'transparent',color:role===r.v?'white':B.muted,transition:'all 0.15s'}}>
            <Ic n={r.ic} size={15}/>{r.l}
          </button>
        ))}
      </div>

      <div style={{display:'flex',flexDirection:'column',gap:'1rem'}}>
        {role==='agency'?(
          <Field label="البريد الإلكتروني للوكالة">
            <div style={{position:'relative'}}>
              <div style={{position:'absolute',right:'0.75rem',top:'50%',transform:'translateY(-50%)',display:'flex',pointerEvents:'none'}}><Ic n="mail" size={14} color={B.muted}/></div>
              <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="agency@email.com" style={{...INP,paddingRight:'2.5rem'}}/>
            </div>
          </Field>
        ):(
          <>
            <Field label="إيميل الوكالة">
              <div style={{position:'relative'}}>
                <div style={{position:'absolute',right:'0.75rem',top:'50%',transform:'translateY(-50%)',display:'flex',pointerEvents:'none'}}><Ic n="building" size={14} color={B.muted}/></div>
                <input type="email" value={agEmail} onChange={e=>setAgEmail(e.target.value)} placeholder="إيميل الوكالة تاوعك" style={{...INP,paddingRight:'2.5rem'}}/>
              </div>
            </Field>
            <div style={{padding:'0.5rem 0.75rem',background:'rgba(176,74,47,0.1)',border:'1px solid rgba(176,74,47,0.2)',borderRadius:'0.5rem',fontSize:'0.75rem',color:B.accent}}>
              💡 كلمة السر تاوعك حطها ليك المسير تاع الوكالة
            </div>
          </>
        )}

        <Field label="كلمة السر">
          <PwField value={pw} onChange={setPw} show={show} setShow={setShow} placeholder="كلمة السر" onEnter={submit}/>
        </Field>

        {err&&<div style={{fontSize:'0.75rem',color:B.danger,fontWeight:'700',padding:'0.5rem 0.75rem',background:'rgba(239,68,68,0.1)',borderRadius:'0.5rem',border:'1px solid rgba(239,68,68,0.2)'}}>{err}</div>}

        <button onClick={submit} disabled={loading} style={{width:'100%',padding:'0.875rem',borderRadius:'0.75rem',background:B.accent,color:'white',fontWeight:'700',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:'0.5rem',opacity:loading?0.7:1}}>
          {loading?<><span className="spin" style={{display:'inline-block'}}><Ic n="loader" size={16} color="white"/></span>جاري الدخول...</>:'دخول'}
        </button>
        <button onClick={onBack} style={{background:'none',border:'none',cursor:'pointer',color:B.muted,fontSize:'0.875rem',textAlign:'center'}}>← رجع</button>
      </div>
    </AuthCard>
  );
}

function EditAgencyModal({ag,onClose,onSave}){
  const[plan,setPlan]=useState(ag.plan||'free');
  const[days,setDays]=useState('30');
  const[active,setActive]=useState(ag.is_active!==false);
  const[notes,setNotes]=useState(ag.notes||'');
  const save=()=>{
    const patch={plan,is_active:active,notes};
    if(plan!=='free'&&days){const e=new Date();e.setDate(e.getDate()+Number(days));patch.plan_expires_at=e.toISOString();}
    if(plan==='free')patch.plan_expires_at=null;
    onSave(ag.id,patch);
  };
  return(
    <Modal onClose={onClose} title={`إدارة: ${ag.name}`}>
      <div style={{display:'flex',flexDirection:'column',gap:'1rem'}}>
        <Field label="الخطة">
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'0.5rem'}}>
            {[{v:'free',l:'مجاني',c:'#888'},{v:'basic',l:'Basic ⭐',c:'#fbbf24'},{v:'pro',l:'Pro 💎',c:'#a78bfa'}].map(p=>(
              <button key={p.v} onClick={()=>setPlan(p.v)}
                style={{padding:'0.625rem',borderRadius:'0.75rem',border:`2px solid ${plan===p.v?p.c:B.border}`,background:plan===p.v?`${p.c}22`:'transparent',color:p.c,fontWeight:'700',cursor:'pointer',fontSize:'0.8rem'}}>
                {p.l}
              </button>
            ))}
          </div>
        </Field>
        {plan!=='free'&&(
          <Field label="مدة الاشتراك">
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'0.5rem'}}>
              {['30','90','365'].map(d=>(
                <button key={d} onClick={()=>setDays(d)}
                  style={{padding:'0.5rem',borderRadius:'0.75rem',border:`2px solid ${days===d?B.accent:B.border}`,background:days===d?B.accentSoft:'transparent',color:days===d?B.accent:B.text,fontWeight:'700',cursor:'pointer',fontSize:'0.8rem'}}>
                  {d==='30'?'شهر':d==='90'?'3 أشهر':'سنة'}

              ))}
            </div>
          </Field>
        )}
        <label style={{display:'flex',alignItems:'center',gap:'0.75rem',padding:'0.875rem',background:active?'rgba(34,197,94,0.1)':'rgba(239,68,68,0.1)',borderRadius:'0.75rem',cursor:'pointer',border:`1px solid ${active?'rgba(34,197,94,0.2)':'rgba(239,68,68,0.2)'}`}}>
          <input type="checkbox" checked={active} onChange={e=>setActive(e.target.checked)} style={{width:'1.25rem',height:'1.25rem',accentColor:B.success}}/>
          <div>
            <div style={{fontWeight:'700',color:active?B.success:B.danger,fontSize:'0.875rem'}}>{active?'✅ الحساب نشط':'🚫 الحساب موقوف'}</div>
            <div style={{fontSize:'0.7rem',color:B.muted}}>{active?'الوكالة تقدر تدخل':'الوكالة محجوبة'}</div>
          </div>
        </label>
        <Field label="ملاحظات">
          <textarea value={notes} onChange={e=>setNotes(e.target.value)} placeholder="مثال: دفع بتاريخ 01/06/2025..." style={{...INP,height:'70px',resize:'none'}}/>
        </Field>
        <button onClick={save} style={{width:'100%',padding:'0.875rem',borderRadius:'0.75rem',background:B.accent,color:'white',fontWeight:'700',border:'none',cursor:'pointer'}}>
          حفظ التعديلات
        </button>
      </div>
    </Modal>
  );
}

// ─── AGENCY APP ───────────────────────────────────────────
function AgencyApp({agency,onLogout}){
  const[data,setData]=useState(EMPTY);
  const[loading,setLoading]=useState(true);
  const[saving,setSaving]=useState(false);
  const[tab,setTab]=useState('dashboard');
  const[toast,setToast]=useState(null);

  useEffect(()=>{DB.loadData(agency.id).then(d=>{setData(d);setLoading(false);});},[agency.id]);

  const persist=async next=>{
    setData(next);setSaving(true);
    try{await DB.saveData(agency.id,next);}
    catch(e){showToast('فشل الحفظ — تحقق من الاتصال','error');}
    finally{setSaving(false);}
  };

  const showToast=(msg,type='success')=>{setToast({msg,type});setTimeout(()=>setToast(null),3000);};

  const canAdd=type=>{
    if(agency.plan!=='free')return true;
    if(type==='editor')return data.editors.length<FREE_LIMITS.editors;
    if(type==='client')return data.clients.length<FREE_LIMITS.clients;
    if(type==='video')return data.videos.length<FREE_LIMITS.videos;
    return true;
  };

  const tabs=[
    {id:'dashboard',label:'لوحة التحكم',ic:'dashboard'},
    {id:'videos',label:'الفيديوهات',ic:'film'},
    {id:'editors',label:'الإيديتورز',ic:'users'},
    {id:'clients',label:'الزبائن',ic:'briefcase'},
  ];

  const addEditor=(name,pw)=>{
    if(!canAdd('editor'))return showToast(`وصلت للحد المجاني (${FREE_LIMITS.editors}). تواصل معنا للترقية!`,'error');
    persist({...data,editors:[...data.editors,{id:uid(),name,password:hash(pw)}]});showToast('تم إضافة الإيديتور ✅');
  };

                <span style={{padding:'0.1rem 0.4rem',borderRadius:'9999px',background:pl.bg,color:pl.color,fontWeight:'700'}}>{pl.label}</span>
                {dl!==null&&<span style={{color:dl<7?B.danger:B.muted}}>· {dl} يوم</span>}
                {saving&&<span style={{color:B.accent}}>· يحفظ...</span>}
              </div>
            </div>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:'0.5rem'}}>
            <nav style={{display:'flex',gap:'0.2rem',background:'#111',borderRadius:'9999px',padding:'0.25rem',overflowX:'auto'}}>
              {tabs.map(t=>(
                <button key={t.id} onClick={()=>setTab(t.id)}
                  style={{display:'flex',alignItems:'center',gap:'0.3rem',padding:'0.4rem 0.7rem',borderRadius:'9999px',border:'none',cursor:'pointer',fontWeight:'700',fontSize:'0.72rem',whiteSpace:'nowrap',background:tab===t.id?B.accent:'transparent',color:tab===t.id?'white':B.muted,transition:'all 0.15s'}}>

            <button onClick={onLogout} style={{padding:'0.5rem',borderRadius:'50%',border:'none',background:'none',cursor:'pointer',color:B.muted,display:'flex'}}>
              <Ic n="logout" size={17}/>
            </button>
          </div>
        </div>
        {agency.plan==='free'&&(
          <div style={{background:'rgba(176,74,47,0.1)',borderTop:`1px solid rgba(176,74,47,0.2)`,padding:'0.4rem 1rem',textAlign:'center',fontSize:'0.72rem',color:B.accent,fontWeight:'600'}}>
            ⚡ مجاني: {data.editors.length}/{FREE_LIMITS.editors} إيديتور · {data.videos.length}/{FREE_LIMITS.videos} فيديو · تواصل معنا للترقية

        {tab==='editors'&&<EditorsTab data={data} addEditor={addEditor} updEditor={updEditor} delEditor={delEditor} canAdd={canAdd('editor')} limit={FREE_LIMITS.editors} plan={agency.plan}/>}

// ─── EDITOR APP ───────────────────────────────────────────
function EditorApp({agency,editor,initialData,onLogout}){

  const myVideos=data.videos.filter(v=>v.editorId===editor.id);

  const persist=async next=>{
    setData(next);setSaving(true);

    catch(e){showToast('فشل الحفظ','error');}
    finally{setSaving(false);}

    persist({...data,videos:[{id:uid(),...v,editorId:editor.id,paid:false,createdAt:new Date().toISOString()},...data.videos]});

  };
  const delVideo=id=>{
    const v=data.videos.find(x=>x.id===id);

                <Ic n="video" size={10}/> إيديتور · {agency.name}
                {saving&&<span style={{color:B.accent}}>· يحفظ...</span>}
              </div>
            </div>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:'0.5rem'}}>
            <nav style={{display:'flex',gap:'0.2rem',background:'#111',borderRadius:'9999px',padding:'0.25rem'}}>
              {tabs.map(t=>(
                <button key={t.id} onClick={()=>setTab(t.id)}
                  style={{display:'flex',alignItems:'center',gap:'0.3rem',padding:'0.4rem 0.7rem',borderRadius:'9999px',border:'none',cursor:'pointer',fontWeight:'700',fontSize:'0.72rem',whiteSpace:'nowrap',background:tab===t.id?B.accent:'transparent',color:tab===t.id?'white':B.muted,transition:'all 0.15s'}}>

          {toast.msg}
        </div>

  );

// ─── EDITOR VIDEOS TAB ────────────────────────────────────
function EditorVideosTab({data,editor,myVideos,addVideo,updVideo,delVideo}){
  const[showForm,setShowForm]=useState(false);const[editing,setEditing]=useState(null);
  const[search,setSearch]=useState('');const[fS,setFS]=useState('');
  const cMap=Object.fromEntries(data.clients.map(c=>[c.id,c.name]));
  const filt=useMemo(()=>myVideos.filter(v=>{
    if(fS==='paid'&&!v.paid)return false;if(fS==='unpaid'&&v.paid)return false;
    if(search&&!(v.title||'').toLowerCase().includes(search.toLowerCase())&&!(cMap[v.clientId]||'').toLowerCase().includes(search.toLowerCase()))return false;
    return true;
  }),[myVideos,fS,search,cMap]);
  const tot=filt.reduce((s,v)=>s+Number(v.price||0),0);
  const owed=filt.filter(v=>!v.paid).reduce((s,v)=>s+Number(v.price||0),0);
  const SI={width:'100%',padding:'0.5rem 0.75rem',background:'#111',border:`1px solid ${B.border}`,borderRadius:'0.75rem',outline:'none',fontSize:'0.8rem',color:B.text};
  if(data.clients.length===0)return<div style={{background:'rgba(251,191,36,0.1)',border:'1px solid rgba(251,191,36,0.2)',borderRadius:'1rem',padding:'1.5rem',textAlign:'center',fontSize:'0.875rem',color:'#fbbf24'}}>المسير لازم يزيد الزبائن أول</div>;
  return(
    <div style={{display:'flex',flexDirection:'column',gap:'1.25rem'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:'0.75rem'}}>
        <div>
          <h2 style={{fontSize:'1.75rem',fontWeight:'900',color:B.text}}>فيديوهاتي</h2>
          <p style={{fontSize:'0.75rem',color:B.muted,fontVariantNumeric:'tabular-nums'}}>{filt.length} فيديو · {fmt(tot)} دج · باقي {fmt(owed)} دج</p>
        </div>
        <button onClick={()=>{setEditing(null);setShowForm(true);}} style={{display:'flex',alignItems:'center',gap:'0.4rem',padding:'0.625rem 1rem',borderRadius:'9999px',background:B.accent,color:'white',fontWeight:'700',border:'none',cursor:'pointer',fontSize:'0.8rem',whiteSpace:'nowrap'}}>
          <Ic n="plus" size={16} color="white"/>سجل فيديو
        </button>
      </div>
      <div style={{background:B.card,borderRadius:'1rem',border:`1px solid ${B.border}`,padding:'0.75rem',display:'flex',flexDirection:'column',gap:'0.5rem'}}>
        <div style={{position:'relative'}}>
          <span style={{position:'absolute',right:'0.75rem',top:'50%',transform:'translateY(-50%)',display:'flex',pointerEvents:'none'}}><Ic n="search" size={14} color={B.muted}/></span>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="بحث..." style={{...SI,paddingRight:'2rem'}}/>
        </div>
        <select value={fS} onChange={e=>setFS(e.target.value)} style={SI}>
          <option value="">الكل</option><option value="paid">المدفوع</option><option value="unpaid">الباقي</option>
        </select>
      </div>
      <div style={{background:B.card,borderRadius:'1rem',border:`1px solid ${B.border}`,overflow:'hidden'}}>
        {filt.length===0?<div style={{padding:'2.5rem',textAlign:'center',color:B.muted,fontSize:'0.875rem'}}>ما كاين حتى فيديو</div>
        :filt.map(v=>(
          <div key={v.id} style={{padding:'0.875rem 1.25rem',borderBottom:`1px solid ${B.border}`}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:'0.5rem'}}>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:'flex',alignItems:'center',gap:'0.5rem',flexWrap:'wrap',marginBottom:'0.2rem'}}>
                  <span style={{fontWeight:'700',color:B.text,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{v.title||'بدون عنوان'}</span>
                  <span style={{fontSize:'0.65rem',fontWeight:'700',padding:'0.15rem 0.5rem',borderRadius:'9999px',background:v.paid?'rgba(34,197,94,0.15)':B.accentSoft,color:v.paid?B.success:B.accent}}>
                    {v.paid?'✓ خلص':'✗ ما خلصش'}
                  </span>
                </div>
                <div style={{fontSize:'0.7rem',color:B.muted,display:'flex',gap:'0.5rem',flexWrap:'wrap'}}>
                  <span>{cMap[v.clientId]||'—'}</span>
                  <span style={{fontVariantNumeric:'tabular-nums'}}>{fmtD(v.date)}</span>
                </div>
              </div>
              <div style={{display:'flex',alignItems:'center',gap:'0.25rem',flexShrink:0}}>
                <span style={{fontWeight:'900',fontSize:'1rem',color:B.text,fontVariantNumeric:'tabular-nums'}}>{fmt(v.price)}<span style={{fontSize:'0.65rem',color:B.muted}}> دج</span></span>
                {!v.paid&&<>
                  <button onClick={()=>{setEditing(v);setShowForm(true);}} style={{padding:'0.4rem',border:'none',background:'none',cursor:'pointer',color:B.muted,display:'flex'}}><Ic n="pencil" size={14}/></button>

    </div>
  );
}

// ─── AGENCY DASHBOARD ─────────────────────────────────────
function AgencyDash({data,setTab,agency}){
  const stats=useMemo(()=>{
    const tot=data.videos.reduce((s,v)=>s+Number(v.price||0),0);
    const pd=data.videos.filter(v=>v.paid).reduce((s,v)=>s+Number(v.price||0),0);
    const ms=new Date();ms.setDate(1);ms.setHours(0,0,0,0);
    const mv=data.videos.filter(v=>new Date(v.date)>=ms);
    const be={};
    data.videos.forEach(v=>{
      if(!be[v.editorId])be[v.editorId]={total:0,owed:0,count:0};
      be[v.editorId].total+=Number(v.price||0);be[v.editorId].count++;
      if(!v.paid)be[v.editorId].owed+=Number(v.price||0);
    });
    return{tot,pd,owed:tot-pd,mTot:mv.reduce((s,v)=>s+Number(v.price||0),0),mCnt:mv.length,
      edRows:data.editors.map(e=>({...e,...(be[e.id]||{total:0,owed:0,count:0})})).sort((a,b)=>b.owed-a.owed)};
  },[data]);
  const eMap=Object.fromEntries(data.editors.map(e=>[e.id,e.name]));
  const cMap=Object.fromEntries(data.clients.map(c=>[c.id,c.name]));

  if(!data.editors.length&&!data.clients.length&&!data.videos.length)return(
    <div style={{textAlign:'center',padding:'3rem 1rem'}}>
      <Logo size={80}/>
      <h2 style={{fontSize:'1.75rem',fontWeight:'900',color:B.text,margin:'1rem 0 0.5rem'}}>مرحبا بيك في {agency.name} 🚀</h2>

        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'0.5rem'}}>

            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:'0.5rem'}}>

function VideoForm({editors,clients,initial,lockedEditor,onClose,onSave}){
  const[f,setF]=useState(initial||{title:'',editorId:editors[0]?.id||'',clientId:clients[0]?.id||'',date:today(),price:'',paid:false});

    if(!f.editorId||!f.clientId)return alert('اختار إيديتور وزبون');

  return(
    <Modal onClose={onClose} title={initial?'تعديل فيديو':'فيديو جديد'}>
      <div style={{display:'flex',flexDirection:'column',gap:'1rem'}}>

        {!lockedEditor?(
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'0.75rem'}}>
            <Field label="الإيديتور"><select value={f.editorId} onChange={e=>setF({...f,editorId:e.target.value})} style={INP}>{editors.map(e=><option key={e.id} value={e.id}>{e.name}</option>)}</select></Field>
            <Field label="الزبون"><select value={f.clientId} onChange={e=>setF({...f,clientId:e.target.value})} style={INP}>{clients.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select></Field>
          </div>
        ):(
          <Field label="الزبون"><select value={f.clientId} onChange={e=>setF({...f,clientId:e.target.value})} style={INP}>{clients.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select></Field>
        )}
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'0.75rem'}}>
          <Field label="التاريخ"><input type="date" value={f.date} onChange={e=>setF({...f,date:e.target.value})} style={INP}/></Field>
          <Field label="السعر (دج)"><input type="number" inputMode="numeric" value={f.price} onChange={e=>setF({...f,price:e.target.value})} placeholder="0" style={{...INP,fontWeight:'700'}}/></Field>
        </div>
        {initial&&!lockedEditor&&(
          <label style={{display:'flex',alignItems:'center',gap:'0.5rem',cursor:'pointer',padding:'0.75rem',background:'#111',borderRadius:'0.75rem',border:`1px solid ${B.border}`}}>
            <input type="checkbox" checked={!!f.paid} onChange={e=>setF({...f,paid:e.target.checked})} style={{width:'1.25rem',height:'1.25rem',accentColor:B.success}}/>
            <span style={{fontSize:'0.875rem',fontWeight:'600',color:B.text}}>خلصت الإيديتور</span>
          </label>
        )}
        <button onClick={submit} style={{width:'100%',padding:'0.875rem',borderRadius:'0.75rem',background:B.accent,color:'white',fontWeight:'700',border:'none',cursor:'pointer'}}>{initial?'حفظ':'سجل'}</button>
      </div>
    </Modal>
  );
}

function EditorFormComp({initial,onClose,onSave}){
  const[name,setName]=useState(initial?.name||'');const[pw,setPw]=useState('');
  const[show,setShow]=useState(false);const[err,setErr]=useState('');
  const submit=()=>{
    if(!name.trim())return setErr('دخل الاسم');
    if(!initial&&pw.length<4)return setErr('كلمة السر لازم تكون 4 حروف');
    if(initial&&pw&&pw.length<4)return setErr('كلمة السر لازم تكون 4 حروف');
    onSave(name.trim(),pw);

  return(
    <Modal onClose={onClose} title={initial?'تعديل الإيديتور':'إيديتور جديد'}>
      <div style={{display:'flex',flexDirection:'column',gap:'1rem'}}>

        </Field>
        {err&&<div style={{fontSize:'0.75rem',color:B.danger,fontWeight:'700'}}>{err}</div>}
        <button onClick={submit} style={{width:'100%',padding:'0.875rem',borderRadius:'0.75rem',background:B.accent,color:'white',fontWeight:'700',border:'none',cursor:'pointer'}}>{initial?'حفظ':'زيد'}</button>

    </Modal>
  );
}

              <div style={{width:'2.5rem',height:'2.5rem',borderRadius:'50%',display:'grid',placeItems:'center',fontWeight:'700',flexShrink:0,background:'rgba(59,130,246,0.15)',color:'#60a5fa'}}>{item.name.charAt(0)}</div>
              <div style={{flex:1,minWidth:0}}>
                {isEd?<div style={{display:'flex',gap:'0.5rem'}}>
                  <input value={edName} onChange={e=>setEdName(e.target.value)} onKeyDown={e=>e.key==='Enter'&&(edName.trim()&&updClient(edId,edName.trim()),setEdId(null))}
                    style={{flex:1,padding:'0.375rem 0.75rem',border:`1px solid ${B.border}`,borderRadius:'0.5rem',outline:'none',fontSize:'0.875rem',background:'#111',color:B.text}} autoFocus/>
                  <button onClick={()=>{if(edName.trim())updClient(edId,edName.trim());setEdId(null);}} style={{padding:'0.4rem',border:'none',background:'none',cursor:'pointer',color:B.success,display:'flex'}}><Ic n="check" size={16} color={B.success}/></button>
                  <button onClick={()=>setEdId(null)} style={{padding:'0.4rem',border:'none',background:'none',cursor:'pointer',color:B.muted,display:'flex'}}><Ic n="x" size={16}/></button>
                </div>:<><div style={{fontWeight:'700',color:B.text}}>{item.name}</div><div style={{fontSize:'0.75rem',color:B.muted}}>{s.count} فيديو · {fmt(s.total)} دج</div></>}
              </div>
              {!isEd&&<div style={{display:'flex',gap:'0.15rem',flexShrink:0}}>
                <button onClick={()=>{setEdId(item.id);setEdName(item.name);}} style={{padding:'0.4rem',border:'none',background:'none',cursor:'pointer',color:B.muted,display:'flex'}}><Ic n="pencil" size={14}/></button>
                <button onClick={()=>delClient(item.id)} style={{padding:'0.4rem',border:'none',background:'none',cursor:'pointer',color:B.danger,display:'flex'}}><Ic n="trash" size={14} color={B.danger}/></button>
              </div>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ─── ROOT APP ─────────────────────────────────────────────
function App(){
  const[screen,setScreen]=useState('landing');
  const[agency,setAgency]=useState(null);
  const[editor,setEditor]=useState(null);
  const[editorData,setEditorData]=useState(null);

  useEffect(()=>{
    const saved=localStorage.getItem('bgh_beta_session');
    if(saved){
      try{
        const s=JSON.parse(saved);
        if(s.type==='superadmin')setScreen('superadmin');
        else if(s.type==='agency'&&s.agency){
          if(isSuspended(s.agency)||isExpired(s.agency)&&s.agency.plan!=='free'){setAgency(s.agency);setScreen('expired');}
          else{setAgency(s.agency);setScreen('agency');}
        }
        else if(s.type==='editor'&&s.agency&&s.editor){
          if(isSuspended(s.agency)||isExpired(s.agency)&&s.agency.plan!=='free'){setAgency(s.agency);setScreen('expired');}
          else{setAgency(s.agency);setEditor(s.editor);setEditorData(s.editorData);setScreen('editor');}
        }
      }catch(e){}
    }
  },[]);

  const saveSession=s=>localStorage.setItem('bgh_beta_session',JSON.stringify(s));

  const onAgencyLogin=ag=>{
    if(isSuspended(ag)||isExpired(ag)&&ag.plan!=='free'){setAgency(ag);setScreen('expired');}
    else{setAgency(ag);saveSession({type:'agency',agency:ag});setScreen('agency');}
  };

  const onEditorLogin=(ag,ed,data)=>{
    if(isSuspended(ag)||isExpired(ag)&&ag.plan!=='free'){setAgency(ag);setScreen('expired');}
    else{setAgency(ag);setEditor(ed);setEditorData(data);saveSession({type:'editor',agency:ag,editor:ed,editorData:data});setScreen('editor');}
  };

  const onSuperAdmin=()=>{saveSession({type:'superadmin'});setScreen('superadmin');};

  const logout=()=>{localStorage.removeItem('bgh_beta_session');setAgency(null);setEditor(null);setEditorData(null);setScreen('landing');};

  if(screen==='landing')return<Landing onLogin={()=>setScreen('login')} onRegister={()=>setScreen('register')}/>;
  if(screen==='register')return<Register onBack={()=>setScreen('landing')} onSuccess={onAgencyLogin}/>;
  if(screen==='login')return<Login onBack={()=>setScreen('landing')} onAgencyLogin={onAgencyLogin} onEditorLogin={onEditorLogin} onSuperAdmin={onSuperAdmin}/>;
  if(screen==='superadmin')return<SuperAdmin onLogout={logout}/>;
  if(screen==='expired'&&agency)return<ExpiredScreen agency={agency} onLogout={logout}/>;
  if(screen==='agency'&&agency)return<AgencyApp agency={agency} onLogout={logout}/>;
  if(screen==='editor'&&editor&&agency)return<EditorApp agency={agency} editor={editor} initialData={editorData} onLogout={logout}/>;
  return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
