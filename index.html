const hash=s=>{let h=0;for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0;}return'h'+Math.abs(h).toString(36)+'_'+s.length;};

// ─── SUBSCRIPTION HELPERS ─────────────────────────────────
const isExpired=ag=>{
  if(!ag.plan_expires_at)return false;
  return new Date(ag.plan_expires_at)<new Date();
};
const isSuspended=ag=>ag.is_active===false;
const planLabel=plan=>{
  if(plan==='pro')return{label:'Pro 💎',color:'#7c3aed',bg:'#ede9fe'};
  if(plan==='basic')return{label:'Basic ⭐',color:'#d97706',bg:'#fef3c7'};
  return{label:'مجاني',color:'#6b7280',bg:'#f3f4f6'};
};
const daysLeft=ag=>{
  if(!ag.plan_expires_at)return null;
  const diff=new Date(ag.plan_expires_at)-new Date();
  return Math.max(0,Math.ceil(diff/(1000*60*60*24)));
};

// ─── DB ───────────────────────────────────────────────────
const DB={
  async register(name,email,password){
    const{data,error}=await sb.from('agencies').insert({name,email,password_hash:hash(password)}).select().single();
    if(error)throw error;
    await sb.from('app_data').insert({agency_id:data.id,data:EMPTY});
    return data;
  },
  async login(email,password){
    const{data,error}=await sb.from('agencies').select('*').eq('email',email).single();
    if(error||!data)throw new Error('البريد الإلكتروني غير موجود');
    if(data.password_hash!==hash(password))throw new Error('كلمة السر غالطة');
    return data;
  },
  async loadData(agencyId){
    const{data,error}=await sb.from('app_data').select('data').eq('agency_id',agencyId).single();
    if(error)return{...EMPTY};
    return data?.data||{...EMPTY};
  },
  async saveData(agencyId,data){
    await sb.from('app_data').upsert({agency_id:agencyId,data,updated_at:new Date().toISOString()});
  },
  async getAllAgencies(){
    const{data}=await sb.from('agencies').select('*').order('created_at',{ascending:false});
    return data||[];
  },
  async getAgencyData(agencyId){
    const{data}=await sb.from('app_data').select('data').eq('agency_id',agencyId).single();
    return data?.data||{...EMPTY};
  },
  async updateAgency(id,patch){
    await sb.from('agencies').update(patch).eq('id',id);
  },
  async deleteAgency(id){
    await sb.from('app_data').delete().eq('agency_id',id);
    await sb.from('agencies').delete().eq('id',id);
  }
};

// ─── REGISTER ─────────────────────────────────────────────
function Register({onBack,onSuccess}){
  const[name,setName]=useState('');const[email,setEmail]=useState('');
  const[pw,setPw]=useState('');const[show,setShow]=useState(false);
  const[err,setErr]=useState('');const[loading,setLoading]=useState(false);
  const submit=async()=>{
    if(!name.trim())return setErr('دخل اسم الوكالة');
    if(!email.includes('@'))return setErr('البريد الإلكتروني غير صحيح');
    if(pw.length<4)return setErr('كلمة السر لازم تكون 4 حروف على الأقل');
    setLoading(true);setErr('');
    try{const ag=await DB.register(name.trim(),email.toLowerCase().trim(),pw);onSuccess(ag);}
    catch(e){setErr(e.message.includes('duplicate')||e.message.includes('unique')?'هذا البريد الإلكتروني مسجل بالفعل':e.message);}
    finally{setLoading(false);}
  };
  return(
    <AuthCard title="إنشاء حساب وكالة" sub="مجاني — لا حاجة لبطاقة بنكية">
      <div style={{display:'flex',flexDirection:'column',gap:'1rem'}}>
        <Field label="اسم الوكالة">
          <div style={{position:'relative'}}>
            <div style={{position:'absolute',right:'0.75rem',top:'50%',transform:'translateY(-50%)',display:'flex',pointerEvents:'none'}}><Ic n="building" size={14} color="#a8a29e"/></div>

// ─── LOGIN ────────────────────────────────────────────────
function Login({onBack,onSuccess,onSuperAdmin}){
  const[email,setEmail]=useState('');const[pw,setPw]=useState('');
  const[show,setShow]=useState(false);const[err,setErr]=useState('');const[loading,setLoading]=useState(false);
  const submit=async()=>{
    if(!email||!pw)return setErr('دخل البريد الإلكتروني وكلمة السر');
    setLoading(true);setErr('');
    if(email===SUPER_EMAIL&&pw===SUPER_PASS){setLoading(false);onSuperAdmin();return;}
    try{const ag=await DB.login(email.toLowerCase().trim(),pw);onSuccess(ag);}
    catch(e){setErr(e.message);}
    finally{setLoading(false);}
  };
  return(
    <AuthCard title="تسجيل الدخول">
      <div style={{display:'flex',flexDirection:'column',gap:'1rem'}}>
        <Field label="البريد الإلكتروني">
          <div style={{position:'relative'}}>
            <div style={{position:'absolute',right:'0.75rem',top:'50%',transform:'translateY(-50%)',display:'flex',pointerEvents:'none'}}><Ic n="mail" size={14} color="#a8a29e"/></div>
            <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="example@agency.com" style={{...INP,paddingRight:'2.5rem'}}/>
          </div>
        </Field>
        <Field label="كلمة السر">
          <PwField value={pw} onChange={setPw} show={show} setShow={setShow} placeholder="كلمة السر" onEnter={submit}/>
        </Field>
        {err&&<div style={{fontSize:'0.75rem',color:'#dc2626',fontWeight:'700',padding:'0.5rem',background:'#fef2f2',borderRadius:'0.5rem'}}>{err}</div>}
        <button onClick={submit} disabled={loading} style={{width:'100%',padding:'0.875rem',borderRadius:'0.75rem',background:B.ink,color:'white',fontWeight:'700',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:'0.5rem'}}>
          {loading?<><span className="spin" style={{display:'inline-block'}}><Ic n="loader" size={16} color="white"/></span>جاري الدخول...</>:'دخول'}
        </button>
        <button onClick={onBack} style={{background:'none',border:'none',cursor:'pointer',color:'#78716c',fontSize:'0.875rem',textAlign:'center'}}>← رجع</button>
      </div>
    </AuthCard>
  );
}

// ─── EDIT AGENCY MODAL ────────────────────────────────────
function EditAgencyModal({ag,onClose,onSave}){
  const[plan,setPlan]=useState(ag.plan||'free');
  const[days,setDays]=useState('30');
  const[active,setActive]=useState(ag.is_active!==false);
  const[notes,setNotes]=useState(ag.notes||'');

  const save=()=>{
    const patch={plan,is_active:active,notes};
    if(plan!=='free'&&days){
      const exp=new Date();
      exp.setDate(exp.getDate()+Number(days));
      patch.plan_expires_at=exp.toISOString();
    }
    if(plan==='free'){patch.plan_expires_at=null;}
    onSave(ag.id,patch);
  };

  return(
    <Modal onClose={onClose} title={`إدارة: ${ag.name}`}>
      <div style={{display:'flex',flexDirection:'column',gap:'1rem'}}>

        {/* Plan */}
        <Field label="الخطة">
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'0.5rem'}}>
            {[{v:'free',l:'مجاني',c:'#6b7280',bg:'#f3f4f6'},{v:'basic',l:'Basic ⭐',c:'#d97706',bg:'#fef3c7'},{v:'pro',l:'Pro 💎',c:'#7c3aed',bg:'#ede9fe'}].map(p=>(
              <button key={p.v} onClick={()=>setPlan(p.v)}
                style={{padding:'0.625rem',borderRadius:'0.75rem',border:`2px solid ${plan===p.v?p.c:'transparent'}`,background:p.bg,color:p.c,fontWeight:'700',cursor:'pointer',fontSize:'0.8rem'}}>
                {p.l}
              </button>
            ))}
          </div>
        </Field>

        {/* Duration */}
        {plan!=='free'&&(
          <Field label="مدة الاشتراك (أيام)">
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'0.5rem'}}>
              {['30','90','365'].map(d=>(
                <button key={d} onClick={()=>setDays(d)}
                  style={{padding:'0.5rem',borderRadius:'0.75rem',border:`2px solid ${days===d?B.ink:'#e7e5e4'}`,background:days===d?B.ink:'white',color:days===d?'white':'#1c1917',fontWeight:'700',cursor:'pointer',fontSize:'0.8rem'}}>
                  {d==='30'?'شهر':d==='90'?'3 أشهر':'سنة'}
                </button>
              ))}
            </div>
          </Field>
        )}

        {/* Status */}
        <label style={{display:'flex',alignItems:'center',gap:'0.75rem',padding:'0.875rem',background:active?'#f0fdf4':'#fef2f2',borderRadius:'0.75rem',cursor:'pointer'}}>
          <input type="checkbox" checked={active} onChange={e=>setActive(e.target.checked)} style={{width:'1.25rem',height:'1.25rem',accentColor:'#059669'}}/>
          <div>
            <div style={{fontWeight:'700',color:active?'#059669':'#dc2626',fontSize:'0.875rem'}}>
              {active?'✅ الحساب نشط':'🚫 الحساب موقوف'}
            </div>
            <div style={{fontSize:'0.7rem',color:'#78716c'}}>
              {active?'الوكالة تقدر تدخل وتستعمل المنصة':'الوكالة محجوبة من الدخول'}
            </div>
          </div>
        </label>

        {/* Notes */}
        <Field label="ملاحظات (اختياري)">
          <textarea value={notes} onChange={e=>setNotes(e.target.value)} placeholder="مثال: دفع بتاريخ 01/06/2025..."
            style={{...INP,height:'70px',resize:'none'}}/>
        </Field>

        <button onClick={save} style={{width:'100%',padding:'0.875rem',borderRadius:'0.75rem',background:B.ink,color:'white',fontWeight:'700',border:'none',cursor:'pointer'}}>
          حفظ التعديلات
        </button>
      </div>
    </Modal>
  );
}

function AgencyApp({agency,onLogout}){
  const[data,setData]=useState({editors:[],clients:[],videos:[]});
  const[loading,setLoading]=useState(true);
  const[saving,setSaving]=useState(false);
  const[tab,setTab]=useState('dashboard');
  const[toast,setToast]=useState(null);

  useEffect(()=>{DB.loadData(agency.id).then(d=>{setData(d);setLoading(false);});},[agency.id]);

  const persist=async next=>{
    setData(next);setSaving(true);
    try{await DB.saveData(agency.id,next);}
    catch(e){showToast('فشل الحفظ','error');}
    finally{setSaving(false);}
  };

  const showToast=(msg,type='success')=>{setToast({msg,type});setTimeout(()=>setToast(null),2500);};

  // Check limits for free plan
  const canAdd=(type)=>{
    if(agency.plan!=='free')return true;
    if(type==='editor')return data.editors.length<FREE_LIMITS.editors;
    if(type==='client')return data.clients.length<FREE_LIMITS.clients;
    if(type==='video')return data.videos.length<FREE_LIMITS.videos;
    return true;
  };

  const tabs=[
    {id:'dashboard',label:'لوحة التحكم',ic:'dashboard'},
    {id:'videos',label:'الفيديوهات',ic:'film'},
    {id:'editors',label:'الإيديتورز',ic:'users'},
    {id:'clients',label:'الزبائن',ic:'briefcase'},
  ];

  const addEditor=(name,pw)=>{
    if(!canAdd('editor'))return showToast(`الخطة المجانية: ${FREE_LIMITS.editors} إيديتور فقط. اشترك للترقية!`,'error');
    persist({...data,editors:[...data.editors,{id:uid(),name,password:hash(pw)}]});showToast('تم إضافة الإيديتور');
  };
  const updEditor=(id,patch)=>persist({...data,editors:data.editors.map(e=>e.id===id?{...e,...patch}:e)});
  const delEditor=(id)=>{if(!confirm('متأكد؟'))return;persist({...data,editors:data.editors.filter(e=>e.id!==id),videos:data.videos.filter(v=>v.editorId!==id)});showToast('تم الحذف');};
  const addClient=(name)=>{
    if(!canAdd('client'))return showToast(`الخطة المجانية: ${FREE_LIMITS.clients} زبائن فقط. اشترك للترقية!`,'error');
    persist({...data,clients:[...data.clients,{id:uid(),name}]});showToast('تم إضافة الزبون');
  };
  const updClient=(id,name)=>persist({...data,clients:data.clients.map(c=>c.id===id?{...c,name}:c)});
  const delClient=(id)=>{if(!confirm('متأكد؟'))return;persist({...data,clients:data.clients.filter(c=>c.id!==id),videos:data.videos.filter(v=>v.clientId!==id)});showToast('تم الحذف');};
  const addVideo=(v)=>{
    if(!canAdd('video'))return showToast(`الخطة المجانية: ${FREE_LIMITS.videos} فيديو فقط. اشترك للترقية!`,'error');
    persist({...data,videos:[{id:uid(),...v,paid:false,createdAt:new Date().toISOString()},...data.videos]});showToast('تم تسجيل الفيديو');
  };
  const updVideo=(id,patch)=>persist({...data,videos:data.videos.map(x=>x.id===id?{...x,...patch}:x)});
  const delVideo=(id)=>{if(!confirm('متأكد؟'))return;persist({...data,videos:data.videos.filter(x=>x.id!==id)});showToast('تم الحذف');};
  const togglePaid=(id)=>{const v=data.videos.find(x=>x.id===id);persist({...data,videos:data.videos.map(x=>x.id===id?{...x,paid:!v.paid}:x)});};

  const pl=planLabel(agency.plan);
  const dl=daysLeft(agency);

  if(loading)return(
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:B.bg,flexDirection:'column',gap:'1rem'}}>
      <Logo size={70}/>
      <div style={{color:'#78716c',fontSize:'0.875rem'}}>جاري التحميل...</div>
    </div>
  );

  return(
    <div style={{minHeight:'100vh',background:B.bg,fontFamily:"'Cairo',sans-serif"}}>
      <header style={{borderBottom:'1px solid #e7e5e4',background:'rgba(255,255,255,0.85)',backdropFilter:'blur(8px)',position:'sticky',top:0,zIndex:40}}>
        <div style={{maxWidth:'80rem',margin:'0 auto',padding:'0.75rem 1rem',display:'flex',alignItems:'center',justifyContent:'space-between',gap:'0.75rem'}}>
          <div style={{display:'flex',alignItems:'center',gap:'0.75rem'}}>
            <Logo size={38}/>
            <div>
              <div style={{fontWeight:'800',fontSize:'0.95rem',color:'#1c1917',lineHeight:1}}>{agency.name}</div>
              <div style={{fontSize:'0.65rem',color:'#78716c',display:'flex',alignItems:'center',gap:'0.35rem',marginTop:'2px'}}>
                <span style={{padding:'0.1rem 0.4rem',borderRadius:'9999px',background:pl.bg,color:pl.color,fontWeight:'700'}}>{pl.label}</span>
                {dl!==null&&<span style={{color:dl<7?'#dc2626':'#78716c'}}>· {dl} يوم باقي</span>}
                {saving&&<span>· يحفظ...</span>}
              </div>
            </div>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:'0.5rem'}}>
            <nav style={{display:'flex',gap:'0.2rem',background:'#f5f5f4',borderRadius:'9999px',padding:'0.25rem',overflowX:'auto'}}>
              {tabs.map(t=>(
                <button key={t.id} onClick={()=>setTab(t.id)}
                  style={{display:'flex',alignItems:'center',gap:'0.3rem',padding:'0.4rem 0.7rem',borderRadius:'9999px',border:'none',cursor:'pointer',fontWeight:'700',fontSize:'0.72rem',whiteSpace:'nowrap',background:tab===t.id?B.ink:'transparent',color:tab===t.id?'white':'#78716c',transition:'all 0.15s'}}>
                  <Ic n={t.ic} size={12}/>{t.label}
                </button>
              ))}
            </nav>
            <button onClick={onLogout} style={{padding:'0.5rem',borderRadius:'50%',border:'none',background:'none',cursor:'pointer',color:'#78716c',display:'flex'}}>
              <Ic n="logout" size={17}/>
            </button>
          </div>
        </div>

        {/* Free plan warning */}
        {agency.plan==='free'&&(
          <div style={{background:'#fffbeb',borderTop:'1px solid #fde68a',padding:'0.4rem 1rem',textAlign:'center',fontSize:'0.75rem',color:'#92400e',fontWeight:'600'}}>
            ⚡ الخطة المجانية: {data.editors.length}/{FREE_LIMITS.editors} إيديتور · {data.videos.length}/{FREE_LIMITS.videos} فيديو · تواصل معنا للترقية
          </div>
        )}

        {/* Expiry warning */}
        {dl!==null&&dl<=7&&dl>0&&(
          <div style={{background:'#fef2f2',borderTop:'1px solid #fecaca',padding:'0.4rem 1rem',textAlign:'center',fontSize:'0.75rem',color:'#dc2626',fontWeight:'600'}}>
            ⚠️ اشتراكك ينتهي خلال {dl} أيام! تواصل معنا للتجديد
          </div>
        )}
      </header>

      <main style={{maxWidth:'80rem',margin:'0 auto',padding:'1.5rem 1rem'}}>
        {tab==='dashboard'&&<AgencyDash data={data} setTab={setTab} agency={agency}/>}
        {tab==='videos'&&<VideosTab data={data} addVideo={addVideo} updVideo={updVideo} delVideo={delVideo} togglePaid={togglePaid}/>}
        {tab==='editors'&&<EditorsTab data={data} addEditor={addEditor} updEditor={updEditor} delEditor={delEditor} canAdd={canAdd('editor')} limit={FREE_LIMITS.editors} plan={agency.plan}/>}
        {tab==='clients'&&<ClientsTab data={data} addClient={addClient} updClient={updClient} delClient={delClient} canAdd={canAdd('client')} limit={FREE_LIMITS.clients} plan={agency.plan}/>}
      </main>

      {toast&&(
        <div style={{position:'fixed',bottom:'1.5rem',left:'50%',transform:'translateX(-50%)',padding:'0.75rem 1.25rem',borderRadius:'9999px',color:'white',fontWeight:'600',fontSize:'0.875rem',boxShadow:'0 10px 15px rgba(0,0,0,0.1)',zIndex:50,background:toast.type==='error'?'#dc2626':B.ink,whiteSpace:'nowrap',maxWidth:'90vw',textAlign:'center'}}>
          {toast.msg}
        </div>
      )}
    </div>
  );
}

// ─── AGENCY DASHBOARD ─────────────────────────────────────
function AgencyDash({data,setTab,agency}){
  const stats=useMemo(()=>{
    const tot=data.videos.reduce((s,v)=>s+Number(v.price||0),0);
    const pd=data.videos.filter(v=>v.paid).reduce((s,v)=>s+Number(v.price||0),0);
    const ms=new Date();ms.setDate(1);ms.setHours(0,0,0,0);
    const mv=data.videos.filter(v=>new Date(v.date)>=ms);
    const be={};
    data.videos.forEach(v=>{
      if(!be[v.editorId])be[v.editorId]={total:0,owed:0,count:0};
      be[v.editorId].total+=Number(v.price||0);be[v.editorId].count++;
      if(!v.paid)be[v.editorId].owed+=Number(v.price||0);
    });
    return{tot,pd,owed:tot-pd,mTot:mv.reduce((s,v)=>s+Number(v.price||0),0),mCnt:mv.length,
      edRows:data.editors.map(e=>({...e,...(be[e.id]||{total:0,owed:0,count:0})})).sort((a,b)=>b.owed-a.owed)};
  },[data]);
  const eMap=Object.fromEntries(data.editors.map(e=>[e.id,e.name]));
  const cMap=Object.fromEntries(data.clients.map(c=>[c.id,c.name]));
  if(!data.editors.length&&!data.clients.length&&!data.videos.length)return(
    <div style={{textAlign:'center',padding:'3rem 1rem'}}>
      <Logo size={80}/>
      <h2 style={{fontSize:'1.75rem',fontWeight:'900',margin:'1rem 0 0.5rem'}}>مرحبا بيك في {agency.name} 👋</h2>
      <p style={{color:'#78716c',marginBottom:'2rem'}}>ابدا بإضافة الإيديتورز والزبائن</p>
      <div style={{display:'flex',gap:'0.75rem',justifyContent:'center',flexWrap:'wrap'}}>
        <button onClick={()=>setTab('editors')} style={{display:'flex',alignItems:'center',gap:'0.5rem',padding:'0.75rem 1.25rem',borderRadius:'9999px',background:B.ink,color:'white',fontWeight:'700',border:'none',cursor:'pointer'}}>
          <Ic n="users" size={17} color="white"/>زيد إيديتور
        </button>
        <button onClick={()=>setTab('clients')} style={{display:'flex',alignItems:'center',gap:'0.5rem',padding:'0.75rem 1.25rem',borderRadius:'9999px',background:'white',color:'#1c1917',fontWeight:'700',border:'1px solid #d6d3d1',cursor:'pointer'}}>
          <Ic n="briefcase" size={17}/>زيد زبون
        </button>
      </div>
    </div>
  );
  return(
    <div style={{display:'flex',flexDirection:'column',gap:'1.5rem'}}>
      <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:'0.75rem'}}>
        <StatCard label="المجموع الكلي" value={stats.tot} ic="trending"/>
        <StatCard label="المدفوع" value={stats.pd} ic="checkCircle" grn/>
        <StatCard label="الباقي خلاص" value={stats.owed} ic="alertCircle" hl/>
        <StatCard label={`الشهر (${stats.mCnt})`} value={stats.mTot} ic="clock"/>
      </div>
      <div style={{background:'white',borderRadius:'1rem',border:'1px solid #e7e5e4',overflow:'hidden'}}>
        <div style={{padding:'1rem 1.25rem',borderBottom:'1px solid #f5f5f4',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div style={{fontWeight:'800',fontSize:'1rem',color:'#1c1917'}}>حسابات الإيديتورز</div>
          <Ic n="wallet" size={18} color="#a8a29e"/>
        </div>
        {stats.edRows.length===0?<div style={{padding:'2rem',textAlign:'center',color:'#a8a29e',fontSize:'0.875rem'}}>ما كاينش إيديتورز</div>
        :stats.edRows.map(e=>(
          <div key={e.id} style={{padding:'0.875rem 1.25rem',display:'flex',alignItems:'center',justifyContent:'space-between',gap:'0.75rem',borderBottom:'1px solid #f5f5f4'}}>
            <div style={{display:'flex',alignItems:'center',gap:'0.75rem',minWidth:0}}>
              <div style={{width:'2.25rem',height:'2.25rem',borderRadius:'50%',display:'grid',placeItems:'center',fontWeight:'700',flexShrink:0,background:B.soft,color:B.accent}}>{e.name.charAt(0)}</div>
              <div style={{minWidth:0}}>
                <div style={{fontWeight:'700',color:'#1c1917',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{e.name}</div>
                <div style={{fontSize:'0.7rem',color:'#78716c'}}>{e.count} فيديو · {fmt(e.total)} دج</div>
              </div>
            </div>
            <div style={{textAlign:'left',flexShrink:0}}>
              <div style={{fontSize:'0.65rem',color:'#78716c'}}>باقي</div>
              <div style={{fontWeight:'900',color:e.owed>0?B.accent:'#a8a29e',fontVariantNumeric:'tabular-nums'}}>{fmt(e.owed)}<span style={{fontSize:'0.65rem'}}> دج</span></div>
            </div>
          </div>
        ))}
      </div>
      <div style={{background:'white',borderRadius:'1rem',border:'1px solid #e7e5e4',overflow:'hidden'}}>
        <div style={{padding:'1rem 1.25rem',borderBottom:'1px solid #f5f5f4',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div style={{fontWeight:'800',fontSize:'1rem',color:'#1c1917'}}>آخر الفيديوهات</div>
          <button onClick={()=>setTab('videos')} style={{fontSize:'0.75rem',fontWeight:'700',color:B.accent,background:'none',border:'none',cursor:'pointer'}}>شوف الكل ←</button>
        </div>
        {data.videos.slice(0,5).map(v=>(
          <div key={v.id} style={{padding:'0.75rem 1.25rem',display:'flex',alignItems:'center',justifyContent:'space-between',gap:'0.75rem',borderBottom:'1px solid #f5f5f4'}}>
            <div style={{minWidth:0}}>
              <div style={{fontWeight:'600',color:'#1c1917',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{v.title||'بدون عنوان'}</div>
              <div style={{fontSize:'0.7rem',color:'#78716c'}}>{eMap[v.editorId]||'—'} · {cMap[v.clientId]||'—'}</div>
            </div>
            <div style={{display:'flex',alignItems:'center',gap:'0.5rem',flexShrink:0}}>
              <span style={{fontSize:'0.65rem',fontWeight:'700',padding:'0.15rem 0.5rem',borderRadius:'9999px',background:v.paid?'#d1fae5':B.soft,color:v.paid?'#047857':B.accent}}>{v.paid?'✓ خلص':'✗ ما خلصش'}</span>
              <span style={{fontWeight:'700',fontSize:'0.875rem',fontVariantNumeric:'tabular-nums'}}>{fmt(v.price)}<span style={{fontSize:'0.65rem',color:'#a8a29e'}}> دج</span></span>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ─── VIDEOS TAB ───────────────────────────────────────────
function VideosTab({data,addVideo,updVideo,delVideo,togglePaid}){
  const[showForm,setShowForm]=useState(false);const[editing,setEditing]=useState(null);
  const[search,setSearch]=useState('');const[fE,setFE]=useState('');const[fC,setFC]=useState('');const[fS,setFS]=useState('');
  const eMap=Object.fromEntries(data.editors.map(e=>[e.id,e.name]));
  const cMap=Object.fromEntries(data.clients.map(c=>[c.id,c.name]));
  const filt=useMemo(()=>data.videos.filter(v=>{
    if(fE&&v.editorId!==fE)return false;if(fC&&v.clientId!==fC)return false;
    if(fS==='paid'&&!v.paid)return false;if(fS==='unpaid'&&v.paid)return false;
    if(search){const q=search.toLowerCase();if(!(v.title||'').toLowerCase().includes(q)&&!(eMap[v.editorId]||'').toLowerCase().includes(q)&&!(cMap[v.clientId]||'').toLowerCase().includes(q))return false;}
    return true;
  }),[data.videos,fE,fC,fS,search,eMap,cMap]);
  const tot=filt.reduce((s,v)=>s+Number(v.price||0),0);
  const owed=filt.filter(v=>!v.paid).reduce((s,v)=>s+Number(v.price||0),0);
  const SI={width:'100%',padding:'0.5rem 0.75rem',background:'#fafaf9',border:'1px solid #e7e5e4',borderRadius:'0.75rem',outline:'none',fontSize:'0.8rem'};
  if(data.clients.length===0)return<div style={{background:'#fffbeb',border:'1px solid #fde68a',borderRadius:'1rem',padding:'1.5rem',textAlign:'center',fontSize:'0.875rem',color:'#92400e'}}>زيد إيديتور وزبون أول</div>;
  return(
    <div style={{display:'flex',flexDirection:'column',gap:'1.25rem'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:'0.75rem'}}>
        <div>
          <h2 style={{fontSize:'1.75rem',fontWeight:'900',color:'#1c1917'}}>الفيديوهات</h2>
          <p style={{fontSize:'0.75rem',color:'#78716c',fontVariantNumeric:'tabular-nums'}}>{filt.length} فيديو · {fmt(tot)} دج · باقي {fmt(owed)} دج</p>
        </div>
        <button onClick={()=>{setEditing(null);setShowForm(true);}} style={{display:'flex',alignItems:'center',gap:'0.4rem',padding:'0.625rem 1rem',borderRadius:'9999px',background:B.ink,color:'white',fontWeight:'700',border:'none',cursor:'pointer',fontSize:'0.8rem',whiteSpace:'nowrap'}}>
          <Ic n="plus" size={16} color="white"/>سجل فيديو
        </button>
      </div>
      <div style={{background:'white',borderRadius:'1rem',border:'1px solid #e7e5e4',padding:'0.75rem',display:'flex',flexDirection:'column',gap:'0.5rem'}}>
        <div style={{position:'relative'}}>
          <span style={{position:'absolute',right:'0.75rem',top:'50%',transform:'translateY(-50%)',display:'flex',pointerEvents:'none'}}><Ic n="search" size={14} color="#a8a29e"/></span>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="بحث..." style={{...SI,paddingRight:'2rem'}}/>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'0.5rem'}}>
          <select value={fE} onChange={e=>setFE(e.target.value)} style={SI}><option value="">كل الإيديتورز</option>{data.editors.map(e=><option key={e.id} value={e.id}>{e.name}</option>)}</select>
          <select value={fC} onChange={e=>setFC(e.target.value)} style={SI}><option value="">كل الزبائن</option>{data.clients.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select>
          <select value={fS} onChange={e=>setFS(e.target.value)} style={SI}><option value="">الكل</option><option value="paid">المدفوع</option><option value="unpaid">الباقي</option></select>
        </div>
      </div>
      <div style={{background:'white',borderRadius:'1rem',border:'1px solid #e7e5e4',overflow:'hidden'}}>
        {filt.length===0?<div style={{padding:'2.5rem',textAlign:'center',color:'#a8a29e',fontSize:'0.875rem'}}>ما كاين حتى فيديو</div>
        :filt.map(v=>(
          <div key={v.id} style={{padding:'0.875rem 1.25rem',borderBottom:'1px solid #f5f5f4'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:'0.5rem'}}>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:'flex',alignItems:'center',gap:'0.5rem',flexWrap:'wrap',marginBottom:'0.2rem'}}>
                  <span style={{fontWeight:'700',color:'#1c1917',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{v.title||'بدون عنوان'}</span>
                  <button onClick={()=>togglePaid(v.id)} style={{fontSize:'0.65rem',fontWeight:'700',padding:'0.15rem 0.5rem',borderRadius:'9999px',border:'none',cursor:'pointer',background:v.paid?'#d1fae5':B.soft,color:v.paid?'#047857':B.accent}}>
                    {v.paid?'✓ خلص':'✗ ما خلصش'}
                  </button>
                </div>
                <div style={{fontSize:'0.7rem',color:'#78716c',display:'flex',gap:'0.5rem',flexWrap:'wrap'}}>
                  <span>{eMap[v.editorId]||'—'}</span><span>{cMap[v.clientId]||'—'}</span>
                  <span style={{fontVariantNumeric:'tabular-nums'}}>{fmtD(v.date)}</span>
                </div>
              </div>
              <div style={{display:'flex',alignItems:'center',gap:'0.25rem',flexShrink:0}}>
                <span style={{fontWeight:'900',fontSize:'1rem',fontVariantNumeric:'tabular-nums'}}>{fmt(v.price)}<span style={{fontSize:'0.65rem',color:'#a8a29e'}}> دج</span></span>
                <button onClick={()=>{setEditing(v);setShowForm(true);}} style={{padding:'0.4rem',border:'none',background:'none',cursor:'pointer',color:'#78716c',display:'flex'}}><Ic n="pencil" size={14}/></button>
                <button onClick={()=>delVideo(v.id)} style={{padding:'0.4rem',border:'none',background:'none',cursor:'pointer',color:'#78716c',display:'flex'}}><Ic n="trash" size={14}/></button>
              </div>
            </div>
          </div>
        ))}
      </div>
      {showForm&&<VideoForm editors={data.editors} clients={data.clients} initial={editing} onClose={()=>{setShowForm(false);setEditing(null);}} onSave={f=>{if(editing)updVideo(editing.id,f);else addVideo(f);setShowForm(false);setEditing(null);}}/>}
    </div>
  );
}

function VideoForm({editors,clients,initial,onClose,onSave}){
  const[f,setF]=useState(initial||{title:'',editorId:editors[0]?.id||'',clientId:clients[0]?.id||'',date:today(),price:'',paid:false});
  const submit=()=>{
    if(!f.editorId||!f.clientId)return alert('اختار إيديتور وزبون');
    if(!f.price||Number(f.price)<=0)return alert('دخل السعر');
    onSave({...f,price:Number(f.price)});
  };
  return(
    <Modal onClose={onClose} title={initial?'تعديل فيديو':'فيديو جديد'}>
      <div style={{display:'flex',flexDirection:'column',gap:'1rem'}}>
        <Field label="عنوان الفيديو"><input value={f.title} onChange={e=>setF({...f,title:e.target.value})} placeholder="إعلان منتج جديد" style={INP}/></Field>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'0.75rem'}}>
          <Field label="الإيديتور"><select value={f.editorId} onChange={e=>setF({...f,editorId:e.target.value})} style={INP}>{editors.map(e=><option key={e.id} value={e.id}>{e.name}</option>)}</select></Field>
          <Field label="الزبون"><select value={f.clientId} onChange={e=>setF({...f,clientId:e.target.value})} style={INP}>{clients.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select></Field>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'0.75rem'}}>
          <Field label="التاريخ"><input type="date" value={f.date} onChange={e=>setF({...f,date:e.target.value})} style={INP}/></Field>
          <Field label="السعر (دج)"><input type="number" inputMode="numeric" value={f.price} onChange={e=>setF({...f,price:e.target.value})} placeholder="0" style={{...INP,fontWeight:'700'}}/></Field>
        </div>
        {initial&&<label style={{display:'flex',alignItems:'center',gap:'0.5rem',cursor:'pointer',padding:'0.75rem',background:'#fafaf9',borderRadius:'0.75rem'}}>
          <input type="checkbox" checked={!!f.paid} onChange={e=>setF({...f,paid:e.target.checked})} style={{width:'1.25rem',height:'1.25rem',accentColor:'#059669'}}/>
          <span style={{fontSize:'0.875rem',fontWeight:'600'}}>خلصت الإيديتور</span>
        </label>}
        <button onClick={submit} style={{width:'100%',padding:'0.875rem',borderRadius:'0.75rem',background:B.ink,color:'white',fontWeight:'700',border:'none',cursor:'pointer'}}>{initial?'حفظ':'سجل'}</button>
      </div>
    </Modal>
  );
}

function EditorForm({initial,onClose,onSave}){
  const[name,setName]=useState(initial?.name||'');const[pw,setPw]=useState('');
  const[show,setShow]=useState(false);const[err,setErr]=useState('');
  const submit=()=>{
    if(!name.trim())return setErr('دخل الاسم');
    if(!initial&&pw.length<4)return setErr('كلمة السر لازم تكون 4 حروف');
    if(initial&&pw&&pw.length<4)return setErr('كلمة السر لازم تكون 4 حروف');
    onSave(name.trim(),pw);
  };
  return(
    <Modal onClose={onClose} title={initial?'تعديل الإيديتور':'إيديتور جديد'}>
      <div style={{display:'flex',flexDirection:'column',gap:'1rem'}}>
        <Field label="الاسم"><input value={name} onChange={e=>setName(e.target.value)} placeholder="اسم الإيديتور" style={INP}/></Field>
        <Field label={initial?'كلمة سر جديدة (اختياري)':'كلمة السر'}>
          <PwField value={pw} onChange={setPw} show={show} setShow={setShow} placeholder={initial?'خليها فارغة باش ما تتبدلش':'كلمة السر'} onEnter={submit}/>
        </Field>
        {err&&<div style={{fontSize:'0.75rem',color:'#dc2626',fontWeight:'700'}}>{err}</div>}
        <button onClick={submit} style={{width:'100%',padding:'0.875rem',borderRadius:'0.75rem',background:B.ink,color:'white',fontWeight:'700',border:'none',cursor:'pointer'}}>{initial?'حفظ':'زيد'}</button>
      </div>
    </Modal>
  );
}

function EditorsTab({data,addEditor,updEditor,delEditor,canAdd,limit,plan}){

  return(
    <div style={{display:'flex',flexDirection:'column',gap:'1.25rem'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <div>
          <h2 style={{fontSize:'1.75rem',fontWeight:'900',color:'#1c1917'}}>الإيديتورز</h2>
          {plan==='free'&&<div style={{fontSize:'0.75rem',color:'#78716c'}}>{data.editors.length}/{limit} في الخطة المجانية</div>}
        </div>
        <button onClick={()=>{setEditing(null);setShowForm(true);}} style={{display:'flex',alignItems:'center',gap:'0.4rem',padding:'0.625rem 1rem',borderRadius:'9999px',background:canAdd?B.ink:'#a8a29e',color:'white',fontWeight:'700',border:'none',cursor:'pointer',fontSize:'0.8rem'}}>
          <Ic n="plus" size={16} color="white"/>زيد إيديتور
        </button>
      </div>
      <div style={{background:'white',borderRadius:'1rem',border:'1px solid #e7e5e4',overflow:'hidden'}}>
        {data.editors.length===0?<div style={{padding:'2.5rem',textAlign:'center',color:'#a8a29e',fontSize:'0.875rem'}}>ما كاين حتى إيديتور</div>
        :data.editors.map(item=>{
          const s=stats[item.id]||{count:0,total:0,owed:0};
          return(
            <div key={item.id} style={{padding:'0.875rem 1.25rem',display:'flex',alignItems:'center',gap:'0.75rem',borderBottom:'1px solid #f5f5f4'}}>
              <div style={{width:'2.5rem',height:'2.5rem',borderRadius:'50%',display:'grid',placeItems:'center',fontWeight:'700',flexShrink:0,background:B.soft,color:B.accent}}>{item.name.charAt(0)}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontWeight:'700',color:'#1c1917'}}>{item.name}</div>
                <div style={{fontSize:'0.75rem',color:'#78716c'}}>{s.count} فيديو · {fmt(s.total)} دج{s.owed>0&&<span style={{color:B.accent,fontWeight:'700'}}> · باقي {fmt(s.owed)} دج</span>}</div>
              </div>
              <div style={{display:'flex',gap:'0.15rem',flexShrink:0}}>
                <button onClick={()=>{setEditing(item);setShowForm(true);}} style={{padding:'0.4rem',border:'none',background:'none',cursor:'pointer',color:'#78716c',display:'flex'}}><Ic n="pencil" size={14}/></button>
                <button onClick={()=>delEditor(item.id)} style={{padding:'0.4rem',border:'none',background:'none',cursor:'pointer',color:'#78716c',display:'flex'}}><Ic n="trash" size={14}/></button>
              </div>
            </div>
          );
        })}
      </div>
      {showForm&&<EditorForm initial={editing} onClose={()=>{setShowForm(false);setEditing(null);}} onSave={(name,pw)=>{if(editing){const p={name};if(pw)p.password=hash(pw);updEditor(editing.id,p);}else addEditor(name,pw);setShowForm(false);setEditing(null);}}/>}
    </div>
  );
}

function ClientsTab({data,addClient,updClient,delClient,canAdd,limit,plan}){
  const[name,setName]=useState('');const[edId,setEdId]=useState(null);const[edName,setEdName]=useState('');
  const stats=useMemo(()=>{const m={};data.videos.forEach(v=>{if(!m[v.clientId])m[v.clientId]={count:0,total:0};m[v.clientId].count++;m[v.clientId].total+=Number(v.price||0);});return m;},[data.videos]);
  const doAdd=()=>{if(name.trim()){addClient(name);setName('');}};
  return(
    <div style={{display:'flex',flexDirection:'column',gap:'1.25rem'}}>
      <div>
        <h2 style={{fontSize:'1.75rem',fontWeight:'900',color:'#1c1917'}}>الزبائن</h2>
        {plan==='free'&&<div style={{fontSize:'0.75rem',color:'#78716c'}}>{data.clients.length}/{limit} في الخطة المجانية</div>}
      </div>
      <div style={{background:'white',borderRadius:'1rem',border:'1px solid #e7e5e4',padding:'0.75rem',display:'flex',gap:'0.5rem'}}>
        <input value={name} onChange={e=>setName(e.target.value)} onKeyDown={e=>e.key==='Enter'&&doAdd()} placeholder="اسم الزبون..." style={{...INP,flex:1}}/>
        <button onClick={doAdd} style={{display:'flex',alignItems:'center',gap:'0.4rem',padding:'0.75rem 1rem',borderRadius:'0.75rem',background:canAdd?B.ink:'#a8a29e',color:'white',fontWeight:'700',border:'none',cursor:'pointer',flexShrink:0}}>
          <Ic n="plus" size={17} color="white"/>زيد
        </button>
      </div>
      <div style={{background:'white',borderRadius:'1rem',border:'1px solid #e7e5e4',overflow:'hidden'}}>
        {data.clients.length===0?<div style={{padding:'2.5rem',textAlign:'center',color:'#a8a29e',fontSize:'0.875rem'}}>ما كاين حتى زبون</div>
        :data.clients.map(item=>{
          const s=stats[item.id]||{count:0,total:0};const isEd=edId===item.id;
          return(
            <div key={item.id} style={{padding:'0.875rem 1.25rem',display:'flex',alignItems:'center',gap:'0.75rem',borderBottom:'1px solid #f5f5f4'}}>
              <div style={{width:'2.5rem',height:'2.5rem',borderRadius:'50%',display:'grid',placeItems:'center',fontWeight:'700',flexShrink:0,background:'#dbeafe',color:'#1d4ed8'}}>{item.name.charAt(0)}</div>
              <div style={{flex:1,minWidth:0}}>
                {isEd?<div style={{display:'flex',gap:'0.5rem'}}>
                  <input value={edName} onChange={e=>setEdName(e.target.value)} onKeyDown={e=>e.key==='Enter'&&(edName.trim()&&updClient(edId,edName.trim()),setEdId(null))}
                    style={{flex:1,padding:'0.375rem 0.75rem',border:'1px solid #d6d3d1',borderRadius:'0.5rem',outline:'none',fontSize:'0.875rem'}} autoFocus/>
                  <button onClick={()=>{if(edName.trim())updClient(edId,edName.trim());setEdId(null);}} style={{padding:'0.4rem',border:'none',background:'none',cursor:'pointer',color:'#059669',display:'flex'}}><Ic n="check" size={16} color="#059669"/></button>
                  <button onClick={()=>setEdId(null)} style={{padding:'0.4rem',border:'none',background:'none',cursor:'pointer',color:'#78716c',display:'flex'}}><Ic n="x" size={16}/></button>
                </div>:<><div style={{fontWeight:'700',color:'#1c1917'}}>{item.name}</div><div style={{fontSize:'0.75rem',color:'#78716c'}}>{s.count} فيديو · {fmt(s.total)} دج</div></>}
              </div>
              {!isEd&&<div style={{display:'flex',gap:'0.15rem',flexShrink:0}}>
                <button onClick={()=>{setEdId(item.id);setEdName(item.name);}} style={{padding:'0.4rem',border:'none',background:'none',cursor:'pointer',color:'#78716c',display:'flex'}}><Ic n="pencil" size={14}/></button>
                <button onClick={()=>delClient(item.id)} style={{padding:'0.4rem',border:'none',background:'none',cursor:'pointer',color:'#78716c',display:'flex'}}><Ic n="trash" size={14}/></button>
              </div>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ─── ROOT APP ─────────────────────────────────────────────
function App(){
  const[screen,setScreen]=useState('landing');
  const[agency,setAgency]=useState(null);

  useEffect(()=>{
    const saved=localStorage.getItem('bgh_session_v2');
    if(saved){
      try{
        const s=JSON.parse(saved);
        if(s.type==='superadmin')setScreen('superadmin');
        else if(s.type==='agency'&&s.agency){
          if(isSuspended(s.agency)){setAgency(s.agency);setScreen('expired');}
          else if(isExpired(s.agency)&&s.agency.plan!=='free'){setAgency(s.agency);setScreen('expired');}
          else{setAgency(s.agency);setScreen('agency');}
        }
      }catch(e){}
    }
  },[]);

  const loginAgency=ag=>{
    if(isSuspended(ag)){setAgency(ag);localStorage.setItem('bgh_session_v2',JSON.stringify({type:'agency',agency:ag}));setScreen('expired');return;}
    if(isExpired(ag)&&ag.plan!=='free'){setAgency(ag);localStorage.setItem('bgh_session_v2',JSON.stringify({type:'agency',agency:ag}));setScreen('expired');return;}
    setAgency(ag);
    localStorage.setItem('bgh_session_v2',JSON.stringify({type:'agency',agency:ag}));
    setScreen('agency');
  };

  const loginSuperAdmin=()=>{
    localStorage.setItem('bgh_session_v2',JSON.stringify({type:'superadmin'}));
    setScreen('superadmin');
  };

  const logout=()=>{
    localStorage.removeItem('bgh_session_v2');
    setAgency(null);setScreen('landing');
  };

  if(screen==='landing')return<Landing onLogin={()=>setScreen('login')} onRegister={()=>setScreen('register')}/>;
  if(screen==='register')return<Register onBack={()=>setScreen('landing')} onSuccess={loginAgency}/>;
  if(screen==='login')return<Login onBack={()=>setScreen('landing')} onSuccess={loginAgency} onSuperAdmin={loginSuperAdmin}/>;
  if(screen==='superadmin')return<SuperAdmin onLogout={logout}/>;
  if(screen==='expired'&&agency)return<ExpiredScreen agency={agency} onLogout={logout}/>;
  if(screen==='agency'&&agency)return<AgencyApp agency={agency} onLogout={logout}/>;
  return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
